<!DOCTYPE html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Setup admin ONLY4U</title>
<style>body{font:16px/1.5 system-ui,sans-serif;background:#0a0d14;color:#f3f5fa;display:grid;place-items:center;min-height:100vh;margin:0;padding:16px}
.b{background:#151b2a;border:1px solid #232c40;border-radius:20px;padding:24px;max-width:440px;width:100%}h1{font-size:22px;margin:0 0 8px}
p{color:#8f9ab0;margin:0 0 14px}label{font-size:13px;color:#8f9ab0}input{width:100%;box-sizing:border-box;padding:12px;margin:4px 0 12px;border-radius:12px;border:1px solid #232c40;background:#101521;color:#fff;font-size:16px}
button{width:100%;padding:14px;border:0;border-radius:12px;background:#ff6a1a;color:#fff;font-weight:700;font-size:16px;cursor:pointer}button:disabled{opacity:.5}
#log{margin-top:14px;font-size:14px;white-space:pre-wrap}.ok{color:#4ade80}.er{color:#f87171}</style></head><body>
<div class="b"><h1>Setup akun admin</h1><p>Alat sekali pakai. Setelah berhasil, hapus file ini dari hosting.</p>
<label>Username</label><input id="u" value="admin" readonly>
<label>Password</label><input id="p" type="text" value="ONLY4U-1975">
<button id="go">Buat akun admin sekarang</button><div id="log"></div></div>
<script type="module">
import{initializeApp}from"https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js";
import{getAuth,createUserWithEmailAndPassword,signInWithEmailAndPassword,updateProfile,signOut}from"https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js";
import{getFirestore,doc,setDoc,getDoc}from"https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js";
const app=initializeApp({apiKey:"AIzaSyBnCTQivPSvekIgtKfjma_9ruVzmiHeAZQ",authDomain:"only4u-ce173.firebaseapp.com",projectId:"only4u-ce173",storageBucket:"only4u-ce173.firebasestorage.app",messagingSenderId:"496980499077",appId:"1:496980499077:web:3e98c32addd5d6ac9467ec"});
const auth=getAuth(app),db=getFirestore(app),EM="admin@only4u.app",L=document.getElementById("log"),B=document.getElementById("go");
const say=(t,c)=>{L.innerHTML+='<div class="'+(c||"")+'">'+t+'</div>'};
const hint={"auth/operation-not-allowed":"Aktifkan Email/Password di Authentication > Sign-in method.","permission-denied":"Publish dulu firestore.rules terbaru di Firestore > Rules.","auth/weak-password":"Password minimal 6 karakter.","auth/web-storage-unsupported":"Buka halaman ini lewat https atau localhost, bukan dari file.","auth/operation-not-supported-in-this-environment":"Buka halaman ini lewat https atau localhost, bukan dari file.","auth/network-request-failed":"Cek koneksi internet."};
B.onclick=async()=>{B.disabled=true;L.innerHTML="";const pw=document.getElementById("p").value;
try{let c;try{c=await createUserWithEmailAndPassword(auth,EM,pw);say("Akun admin dibuat.","ok")}
catch(e){if(e.code!=="auth/email-already-in-use")throw e;
try{c=await signInWithEmailAndPassword(auth,EM,pw);say("Akun admin sudah ada, memakai akun tersebut.","ok")}
catch(e2){say("Akun admin@only4u.app sudah ada dengan password lain. Jika bukan Anda yang membuatnya, hapus di Authentication > Users lalu ulangi.","er");throw e2}}
try{await updateProfile(c.user,{displayName:"admin"})}catch(e){}
await setDoc(doc(db,"admins",c.user.uid),{role:"admin"});
const ok=(await getDoc(doc(db,"admins",c.user.uid))).exists();
if(!ok)throw{code:"gagal-verifikasi"};
say("Selesai! Admin terdaftar.\nLogin di ONLY4U dengan username admin dan password di atas, lalu hapus file setup-admin.html.","ok");await signOut(auth)}
catch(e){const c=e.code||"";say("Gagal ("+(c||e.message)+"). "+(hint[c]||""),"er");B.disabled=false}};
</script></body></html>
