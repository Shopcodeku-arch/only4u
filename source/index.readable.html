/* ===== UPGRADE TAMPILAN ===== */
:root{--bg:#0a0d14;--bg2:#101521;--card:#151b2a;--line:#232c40;--tx:#f3f5fa;--mut:#8f9ab0;--pri:#ff6a1a;--acc:#ffa04d;--cy:#22d3ee;--dp:'Barlow Condensed','Barlow',sans-serif}
html{background:var(--bg)}body{background:none}body::before{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;background:radial-gradient(900px 500px at 85% -10%,#ff6a1a1f,transparent 60%),radial-gradient(700px 500px at -10% 10%,#22d3ee14,transparent 60%)}
header{background:#0a0d14d9;border-bottom:1px solid #ffffff12}
.logo{font-family:var(--dp);font-size:34px;text-shadow:none;transform:skew(-8deg);background:linear-gradient(100deg,#fff 55%,var(--acc));-webkit-background-clip:text;background-clip:text;color:transparent;padding-right:6px}
.chip,.ib{background:#ffffff0a;border-color:#ffffff14;transition:background .2s}.chip:hover,.ib:hover{background:#ffffff16}
h2{font-family:var(--dp);font-size:26px;font-style:italic;letter-spacing:.3px;display:flex;align-items:center;gap:10px;margin:34px 0 14px}
h2::before{content:"";width:5px;height:24px;border-radius:3px;background:linear-gradient(var(--acc),var(--pri));transform:skew(-10deg)}
.hero{border:1px solid #ffffff14;border-radius:26px;padding:40px 30px 34px;min-height:260px;background:linear-gradient(115deg,#0b1a33 0%,#12264d 45%,#0b1a33 100%)}
.hero::before{content:"";position:absolute;right:-60px;top:-40px;bottom:-40px;width:46%;background:linear-gradient(120deg,var(--pri),#ff3d00);transform:skewX(-18deg);opacity:.92;box-shadow:-30px 0 80px #ff6a1a55}
.hero::after{content:"";position:absolute;right:22%;top:-40px;bottom:-40px;width:10px;background:var(--cy);transform:skewX(-18deg);opacity:.7;filter:blur(.5px)}
.hero>*{position:relative;z-index:1}
.hero h1{font-family:var(--dp);font-size:clamp(38px,8vw,68px);line-height:.95;letter-spacing:0;max-width:9em;text-shadow:0 4px 24px #0008}
.hero p{color:#c3cde6;font-size:17px;max-width:26em}
.cream{display:inline-flex;align-items:center;gap:9px;background:#fff;color:#0a0d14;border-radius:99px;padding:8px 18px 8px 14px;font:800 italic 17px var(--dp);letter-spacing:.4px;text-transform:uppercase;box-shadow:0 8px 24px #0006}
.cream i{width:9px;height:9px;border-radius:50%;background:#16a34a;box-shadow:0 0 0 0 #16a34a99;animation:pls 1.8s ease-out infinite}
@keyframes pls{70%{box-shadow:0 0 0 10px #16a34a00}100%{box-shadow:0 0 0 0 #16a34a00}}
.hero .pills{margin-top:22px}.pill{background:#0a0d1470;border-color:#ffffff30;backdrop-filter:blur(6px);font-weight:600;font-size:13px;padding:6px 13px}

.grid{grid-template-columns:repeat(3,1fr);gap:14px}
.game{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:8px 8px 14px;gap:10px;transition:transform .2s,border-color .2s,box-shadow .2s}
.game:hover,.game:focus-visible{transform:translateY(-4px);border-color:var(--pri);box-shadow:0 14px 34px #ff6a1a2e}
.game .art{border-radius:16px}.game b{font-size:15px;font-weight:700}.game span{font-size:12px}
@media(max-width:520px){.grid{gap:8px}.game{border-radius:16px;padding:6px 6px 10px}.game b{font-size:12.5px}}

input{background:var(--bg2);border-radius:14px}input:focus{border-color:var(--pri);box-shadow:0 0 0 3px #ff6a1a30}

.fcard{background:#0f1420;border:1px solid var(--line);border-radius:20px;transition:border-color .2s}.fcard:hover{border-color:var(--pri)}
.fcard .np{font-family:var(--dp);font-size:28px;font-weight:800}.fcard s{color:#f87171aa}

.box h3 em{font-family:var(--dp);border-radius:8px;width:28px;height:28px;font-size:16px;background:linear-gradient(135deg,var(--acc),var(--pri));transform:skew(-8deg)}
.item{background:var(--bg2);border-radius:16px;padding:14px;transition:border-color .2s,transform .15s}.item:hover{border-color:#ff6a1a80;transform:translateY(-2px)}

.btn:not(:disabled):hover{transform:translateY(-2px);box-shadow:0 14px 32px #ff5a1466}.btn.gh{background:var(--bg2);box-shadow:none;color:var(--tx)}
.pay{border-radius:16px;background:linear-gradient(120deg,#ff6a1a24,#ff6a1a0a)}
.modal{background:#04060bcc;backdrop-filter:blur(8px)}.mb{border-radius:26px;box-shadow:0 30px 80px #000a}.timer{font-family:var(--dp);font-size:40px}
.h{border-radius:18px}.st{font-weight:700}.back{font-weight:600;color:var(--acc)}

:focus-visible{outline:2px solid var(--cy);outline-offset:2px}

/* ===== SHIMMER PRODUK (tiap 5 detik) ===== */
.game,.layout .item,.fcard{position:relative;overflow:hidden}
.game::after,.layout .item::after,.fcard::after{content:"";position:absolute;top:0;bottom:0;left:0;width:55%;pointer-events:none;background:linear-gradient(100deg,transparent 0%,#ffffff38 50%,transparent 100%);transform:translateX(-130%) skewX(-18deg);animation:shm 5s ease-in-out infinite}
@keyframes shm{0%{transform:translateX(-130%) skewX(-18deg)}22%,100%{transform:translateX(280%) skewX(-18deg)}}

/* ===== TUTORIAL ORDER ===== */
.how{margin-top:6px}.how h2{margin-top:28px}
.steps{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:12px;counter-reset:st}
.steps li{counter-increment:st;position:relative;background:var(--card);border:1px solid var(--line);border-radius:20px;padding:18px 14px 16px;display:flex;flex-direction:column;gap:6px}
.steps li::before{content:counter(st);font:800 italic 20px var(--dp);width:34px;height:34px;display:grid;place-items:center;border-radius:10px;background:linear-gradient(135deg,var(--acc),var(--pri));margin-bottom:6px;transform:skew(-8deg);box-shadow:0 6px 16px #ff6a1a40}
.steps b{font-family:var(--dp);font-size:20px;font-style:italic;line-height:1.1}
.steps span{color:var(--mut);font-size:13.5px;line-height:1.4}
.hnote{margin:12px 2px 0;color:var(--mut);font-size:13px}
@media(max-width:820px){.steps{grid-template-columns:1fr;gap:8px}.steps li{display:grid;grid-template-columns:34px 1fr;column-gap:12px;row-gap:2px;padding:12px 14px;border-radius:16px}.steps li::before{grid-row:1/3;margin:0;align-self:center}.steps b{font-size:18px}}

.lact{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.lb{font:700 12.5px Barlow,sans-serif;text-decoration:none;color:#fff;background:#ffffff14;border:1px solid #ffffff26;border-radius:99px;padding:6px 13px;cursor:pointer;transition:background .2s}
.lb:hover{background:#ffffff26}.lb+.lb{background:linear-gradient(100deg,#ff7a2a,#ff4d0a);border-color:transparent}
.rxs{display:flex;align-items:center;gap:10px;margin-top:10px;flex-wrap:wrap}.rxs>span{color:var(--mut);font-size:12.5px}
.rxs>div{display:flex;gap:8px}.rxs button{width:42px;height:38px;font-size:19px;line-height:1;border-radius:99px;background:#ffffff0f;border:1px solid #ffffff1f;cursor:pointer;transition:transform .15s,background .2s}
.rxs button:hover{transform:scale(1.1)}.rxs button.on{background:#ff6a1a33;border-color:var(--pri);box-shadow:0 0 0 2px #ff6a1a40}
.rxv{flex-basis:100%;font-size:13px;color:var(--acc)}.rxv b{font-size:17px}

/* ===== MENU BAWAH ===== */
.bn{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(10px + env(safe-area-inset-bottom,0px));z-index:40;display:none;gap:4px;padding:6px;width:min(420px,calc(100% - 24px));background:#0f1420e8;backdrop-filter:blur(14px);border:1px solid #ffffff1c;border-radius:22px;box-shadow:0 12px 40px #000a}
.bn.on{display:flex}
.bn button{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:8px 4px;border:0;background:none;color:var(--mut);font:800 11px var(--dp);letter-spacing:.9px;border-radius:16px;cursor:pointer;transition:background .2s,color .2s}
.bn svg{width:22px;height:22px;pointer-events:none}.bn span{pointer-events:none}
.bn button.on{color:#fff;background:linear-gradient(120deg,#ff6a1a38,#ff6a1a14);box-shadow:inset 0 0 0 1px #ff6a1a66}.bn button.on svg{color:var(--acc)}
body.hasbn{padding-bottom:0}
body.hasbn .toast{bottom:calc(92px + env(safe-area-inset-bottom,0px))}
.faq{display:grid;gap:10px;margin-top:8px}
.faq details{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:0 16px;transition:border-color .2s}
.faq details[open]{border-color:#ff6a1a66}
.faq summary{cursor:pointer;list-style:none;padding:14px 0;font-weight:700;display:flex;justify-content:space-between;gap:12px;align-items:center}
.faq summary::-webkit-details-marker{display:none}.faq summary::after{content:"+";color:var(--acc);font-size:22px;line-height:1}
.faq details[open] summary::after{content:"–"}
.faq p{margin:0 0 14px;color:var(--mut);line-height:1.5;font-size:14.5px}

.chat,.chatbox{margin-bottom:6px;padding:18px}
.chat h3,.chatbox h3{font-family:var(--dp);font-size:21px;font-style:italic;margin:0 0 10px;display:flex;justify-content:space-between;align-items:center}
.chatbox h3 small{font:600 12px Barlow,sans-serif;color:var(--mut);font-style:normal}
.cinfo{color:var(--mut);font-size:14px;margin:6px 0 12px}
.cst{font-size:13px;font-weight:600;padding:8px 12px;border-radius:12px;margin-bottom:10px;background:#16a34a22;color:#4ade80}
.cst.w{background:#f59e0b22;color:#fbbf24}.cst.x{background:#ffffff0f;color:var(--mut)}.cst.a b{color:#fff}
.cm{height:300px;overflow-y:auto;display:flex;flex-direction:column;gap:8px;padding:10px;background:var(--bg2);border-radius:16px;margin-bottom:10px}
.cb{max-width:82%;padding:8px 12px;border-radius:14px;font-size:14.5px;line-height:1.4;word-break:break-word;display:flex;flex-direction:column;gap:2px}
.cb span{white-space:pre-wrap}.cb i{font-style:normal;font-size:10.5px;opacity:.6;align-self:flex-end}
.cb.me{align-self:flex-end;background:linear-gradient(120deg,#ff7a2a,#ff4d0a);border-bottom-right-radius:4px}
.cb.ot{align-self:flex-start;background:#232c40;border-bottom-left-radius:4px}
.cf{display:flex;gap:8px}.cf input{flex:1;min-width:0}.cf .btn{width:auto;padding:0 20px}
.cq{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}.cq span{font-size:12px;padding:4px 10px;border-radius:99px;background:#ffffff0f;color:var(--mut)}.cq span.on{background:#ff6a1a33;color:var(--acc)}
.bn button{position:relative}.bn button.dot::after{content:"";position:absolute;top:6px;left:calc(50% + 9px);width:9px;height:9px;border-radius:50%;background:#ef4444;box-shadow:0 0 0 2px #0f1420}
.cb .bt{font-size:10.5px;font-weight:700;letter-spacing:.4px;color:var(--cy);text-transform:uppercase}
.refb{background:linear-gradient(120deg,#ff6a1a2e,#ff6a1a10);border:1px solid #ff6a1a66;color:var(--acc);border-radius:14px;padding:10px 14px;font-weight:600;font-size:14px;margin-bottom:14px}
.refbox .box{padding:18px}.refbox p{margin:0 0 12px;color:var(--mut);line-height:1.5}.refbox p b{color:var(--acc)}
#rlink{display:block;word-break:break-all;background:var(--bg2);border:1px dashed #ff6a1a66;border-radius:12px;padding:10px 12px;color:var(--acc);font-size:13.5px}
.jl{display:flex;flex-direction:column;gap:8px;margin-top:12px}
.jr{display:flex;align-items:center;gap:10px;background:var(--bg2);border:1px solid var(--line);border-radius:14px;padding:8px 12px}
.jr i{width:34px;height:34px;border-radius:50%;background:linear-gradient(135deg,var(--acc),var(--pri));display:grid;place-items:center;font-weight:800;font-style:normal;color:#fff;flex:none}
.jr div{flex:1;min-width:0}.jr b{display:block}.jr small{color:var(--mut)}
.jr span{font-size:11.5px;font-weight:700;color:var(--acc);background:#ff6a1a22;border-radius:99px;padding:3px 9px;white-space:nowrap}
select{background:var(--bg2);color:var(--tx);border:1px solid var(--line);border-radius:14px;padding:12px;font:inherit;width:100%}
#pdet summary{cursor:pointer;font:800 21px var(--dp);font-style:italic;list-style:none;display:flex;justify-content:space-between;align-items:center;gap:8px}
#pdet summary::-webkit-details-marker{display:none}#pdet summary small{font:600 12px Barlow,sans-serif;color:var(--mut);font-style:normal}
.pf{display:grid;gap:10px;margin-top:14px}
.refsum{background:var(--bg2);border:1px solid #ff6a1a55;border-radius:12px;padding:10px 12px;margin:0 0 12px;font-size:14px;color:var(--tx)}.refsum b{color:var(--acc);font-size:17px}.refsum small{color:var(--mut)}
.pos{width:68px;flex:none;padding:6px 8px;border-radius:10px;text-align:center}
/* ===== SHIMMER MEMUAT PRODUK DARI FIREBASE (maks. 5 detik) ===== */
body.prl .layout .item,body.prl .fcard{pointer-events:none;border-color:transparent;background:linear-gradient(100deg,#1a2133 30%,#2b3752 50%,#1a2133 70%) 0 0/220% 100%;animation:skl 1.3s linear infinite}
body.prl .layout .item>*,body.prl .fcard>*{visibility:hidden}
body.prl .layout .item::after,body.prl .fcard::after{display:none}
@keyframes skl{to{background-position:-220% 0}}
/* ===== ANIMASI HARGA: harga asli zoom/terangkat -> dicoret -> harga diskon muncul ===== */
.pz{display:flex;flex-direction:column;align-items:center;gap:1px;line-height:1.1}
.item .pz s{display:block;position:relative;text-decoration:none;font:600 12px Barlow,sans-serif;color:var(--mut);opacity:.75}
.item .pz s::after{content:"";position:absolute;left:-2px;right:-2px;top:52%;height:2px;border-radius:2px;background:#f87171}
.item .pz em{font-style:normal;color:var(--acc)}
.pz.an s{animation:pzo 1.7s cubic-bezier(.3,.7,.3,1) var(--d,0ms) both}
.pz.an s::after{transform-origin:left center;animation:pzl .4s ease-out calc(var(--d,0ms) + .55s) both}
.pz.an em{animation:pzn 1.7s ease-out var(--d,0ms) both}
@keyframes pzo{0%{transform:scale(1.4);opacity:1;color:var(--tx)}28%{transform:scale(1.6) translateY(-4px);opacity:1;color:#fff;text-shadow:0 0 12px #ff6a1acc}58%{transform:scale(1.6) translateY(-4px);opacity:.9;color:#fff}100%{transform:scale(1);opacity:.75;text-shadow:none}}
@keyframes pzl{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@keyframes pzn{0%,56%{opacity:0;transform:translateY(8px) scale(.7)}78%{opacity:1;transform:translateY(0) scale(1.2);text-shadow:0 0 14px #ff6a1acc}100%{opacity:1;transform:scale(1);text-shadow:none}}
.qty{display:inline-flex;align-items:center;gap:6px;background:var(--bg2);border:1px solid var(--line);border-radius:12px;padding:3px}
.qb{width:34px;height:34px;border:0;border-radius:9px;background:#ffffff14;color:#fff;font:800 22px var(--dp);line-height:1;cursor:pointer;transition:background .2s,transform .12s}
.qb:hover:not(:disabled){background:#ff6a1a55}.qb:active:not(:disabled){transform:scale(.9)}.qb:disabled{opacity:.35;cursor:not-allowed}
.qty b{min-width:30px;text-align:center;font:800 19px var(--dp)}
.pop{animation:qpop .32s ease}@keyframes qpop{40%{transform:scale(1.25);color:var(--acc)}}
.pb.l5 i{width:0;animation:ld5 5s linear forwards}@keyframes ld5{to{width:100%}}
#gdet summary{cursor:pointer;font:800 21px var(--dp);font-style:italic;list-style:none;display:flex;justify-content:space-between;align-items:center;gap:8px}
#gdet summary::-webkit-details-marker{display:none}#gdet summary small{font:600 12px Barlow,sans-serif;color:var(--mut);font-style:normal}
.gi{display:grid;gap:8px;margin-top:14px;padding-top:14px;border-top:1px solid var(--line)}
.gprev{display:flex;gap:8px;align-items:center}.gp1{width:64px;height:64px;border-radius:12px;flex:none}.gp2{width:114px;height:64px;border-radius:10px;flex:none}
/* ===== FLASH, STOK, RINCIAN HARGA ===== */
.item .fl{position:absolute;top:8px;left:8px;z-index:1;font-style:normal;font-size:11px;font-weight:800;background:#fde047;color:#111;border-radius:99px;padding:3px 8px}
.item .sold{position:absolute;inset:auto 8px 8px auto;z-index:2;font-style:normal;font-size:11px;font-weight:800;background:#ef4444;color:#fff;border-radius:99px;padding:3px 9px}
.item.so{opacity:.45;cursor:not-allowed}
.bd{display:grid;gap:6px;margin:12px 0;padding:12px;border-radius:14px;background:var(--bg2);border:1px solid var(--line);font-size:13.5px}
.bd:empty{display:none}.bdr{display:flex;justify-content:space-between;gap:10px;color:var(--mut)}.bdr b{color:var(--tx);font-weight:600;white-space:nowrap}
.bdr.g b{color:#4ade80}.bdr.t{border-top:1px dashed var(--line);padding-top:8px;margin-top:2px;color:var(--tx);font-weight:700}.bdr.t b{color:var(--acc);font-size:16px}
/* ===== PANEL ADMIN ===== */
.atabs{display:flex;gap:8px;overflow-x:auto;margin:6px 0 16px;padding-bottom:4px;scrollbar-width:none}.atabs::-webkit-scrollbar{display:none}
.atabs .tab{flex:none;position:relative;display:inline-flex;align-items:center;gap:6px}.atabs .tab.out{margin-left:auto;color:#f87171}
.bdg{font-style:normal;font-size:11px;font-weight:800;background:#ef4444;color:#fff;border-radius:99px;padding:1px 7px}

#app[data-t="ord"]>#ordadm,#app[data-t="chat"]>#chatadm,#app[data-t="prod"]>#prodadm,#app[data-t="flash"]>#flashadm,#app[data-t="img"]>#gimgadm{display:block}
#prodadm .box,#flashadm .box,#gimgadm .box{margin-bottom:14px}
.fg{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px;margin:12px 0 14px}
.fld{display:grid;gap:5px}.fld>span{font-size:12.5px;font-weight:600;color:var(--mut)}
.cnt{font:700 12px Barlow,sans-serif;color:var(--mut);background:#ffffff12;border-radius:99px;padding:2px 9px;margin-left:8px;font-style:normal}
.pc{display:grid;grid-template-columns:auto 1fr;gap:10px 14px;align-items:center;background:var(--bg2);border:1px solid var(--line);border-radius:16px;padding:12px;margin-top:10px}

.chp.g{background:#16a34a22;color:#4ade80}.chp.y{background:#f59e0b22;color:#fbbf24}.chp.r{background:#ef444422;color:#f87171}.chp.o{background:#ff6a1a22;color:var(--acc)}
.durs{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:0 0 14px;color:var(--mut);font-size:13px}
.fcard .ski{margin-bottom:10px}

.upl{display:block;border:2px dashed #ff6a1a77;border-radius:16px;padding:18px 12px;text-align:center;color:var(--acc);font-weight:700;cursor:pointer;background:#ff6a1a0d;margin-bottom:10px}
.pfp{width:100%;max-height:260px;object-fit:contain;border-radius:12px;background:#0b0f18;margin-bottom:10px}
.btn.dgr{color:#f87171;border-color:#ef444466}
.st.c{background:#ffffff12;color:var(--mut)}
.pfm{position:fixed;inset:0;z-index:80;background:#04060bec;display:grid;place-items:center;padding:16px;overflow:auto;cursor:zoom-out}

function mkApi(F){
  var f=F._fs,db=F._db;if(!f||F.v2)return;F.v2=1;
  var mp=function(s){return s.docs.map(function(d){return Object.assign({id:d.id},d.data())})};
  F.watchWhere=function(col,fld,val,cb,err){return f.onSnapshot(f.query(f.collection(db,col),f.where(fld,"==",val)),function(s){cb(mp(s))},err||function(){})};
  F.watchCol=function(col,cb,err){return f.onSnapshot(f.collection(db,col),function(s){cb(mp(s))},err||function(){})};
  F.ciSet=function(uid,d,isNew){var r=f.doc(db,"checkins",uid);return isNew?f.setDoc(r,d):f.updateDoc(r,d)};
  F.userDocDel=function(uid){return f.deleteDoc(f.doc(db,"users",uid))};
  F.userEnsure=function(uid,name,email){var r=f.doc(db,"users",uid);return f.getDoc(r).then(function(s){if(s.exists())return;var code=rfc(),rf="";
    var chk=code?Promise.race([f.getDoc(f.doc(db,"refs",code)),new Promise(function(_,j){setTimeout(j,4000)})]).then(function(x){if(x.exists())rf=code}).catch(function(){}):Promise.resolve();
    return chk.then(function(){var ud={username:name,createdAt:Date.now()};if(email)ud.email=email;if(rf)ud.ref=rf;var b=f.writeBatch(db);b.set(r,ud);if(rf)b.set(f.doc(db,"refs",rf,"joins",uid),{un:name,t:Date.now()});return b.commit().catch(function(){var u2={username:name,createdAt:Date.now()};if(email)u2.email=email;return f.setDoc(r,u2)})}).then(function(){try{localStorage.removeItem("o4u_ref")}catch(e){}if(rf&&window.onRef)window.onRef()})})};
  F.followSet=function(sid,uid,on){var r=f.doc(db,"follows",sid+"_"+uid);return on?f.setDoc(r,{s:sid,u:uid,t:Date.now()}):f.deleteDoc(r)};
  F.reviewSet=function(sid,uid,d){return f.setDoc(f.doc(db,"reviews",sid+"_"+uid),d)};
  F.reviewDel=function(id){return f.deleteDoc(f.doc(db,"reviews",id))};
  F.gameDelMine=function(k){return f.deleteDoc(f.doc(db,"games",k))};
}

/* ---------- chat otomatis: voucher / langganan tanpa data akun ---------- */
var ACB={};
function autoChat(){
  if(!FB||!FB._fs||!U.id||AD||!window.orders)return;
  window.orders.forEach(function(o){
    if(o.u!==U.id||o.st!=="d"||o.ac||ACB[o.id])return;
    if(Date.now()-(o.t||0)>14*864e5)return;
    var g=G[o.k];if(!g||(g.f&&g.f.length))return;
    ACB[o.id]=1;
    var f=FB._fs,to=o.sid||"",
    txt="Halo, pembayaran saya atas produk "+(o.item||"-")+(o.gn?" ("+o.gn+")":"")+", ID produk: "+(o.pid||"-")+", ID pesanan: "+o.id+", sudah disetujui. Kirimkan data langganan / voucher di sini.";
    f.updateDoc(f.doc(FB._db,"orders",o.id),{ac:true}).then(function(){
      var c=(window.MYL||[]).filter(function(x){return(x.to||"")===to&&x.st==="open"}).sort(function(a,b){return b.t-a.t})[0];
      return c?c.id:FB.chatNew(U.id,U.name,to||undefined)}).then(function(id){return FB.chatSend(id,"u",txt)}).then(function(){
      toast("Pesanan disetujui. Chat ke "+(to?chatName(to):"admin")+" otomatis terkirim, cek di INBOX")}).catch(function(){
      delete ACB[o.id];toast("Pesanan disetujui, tapi chat otomatis gagal. Kirim pesan manual lewat INBOX")});
  });
}
setInterval(autoChat,6000);
